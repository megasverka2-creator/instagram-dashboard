name: Instagram ma'lumot yig'ish

# Har kuni avtomatik ishga tushadi + qo'lda ham ishga tushirish mumkin
on:
  # >>> TASHQI TETIK (cron-job.org) ishlatilgani uchun jadval O'CHIRILDI. Qaytarish: pastdagi # belgilarni olib tashlang. <<<
  # schedule:
  #   # Har kuni UTC 04:00 da (Toshkent vaqti bilan ~09:00)
  #   - cron: '0 4 * * *'
  workflow_dispatch:   # "Run workflow" tugmasi bilan qo'lda ishga tushirish

permissions:
  contents: write   # data faylini repozitoriyaga qaytarib yozish uchun

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Repozitoriyani yuklash
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Shifrlash kutubxonasi
        run: pip install cryptography

      - name: Ma'lumot yig'ish skriptini ishga tushirish
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SAVDO_PAROL: ${{ secrets.SAVDO_PAROL }}
        run: python3 instagram_collector.py

      - name: Yangilangan ma'lumotni saqlash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Eski ochiq faylni repodan/saytdan o'chiramiz (maxfiylik)
          git rm --quiet --ignore-unmatch instagram_data.json || true
          [ -f instagram_data.enc.json ] && git add instagram_data.enc.json || true
          if git diff --staged --quiet; then
            echo "O'zgarish yo'q — saqlash kerak emas"
          else
            git commit -m "Avtomatik: Instagram ma'lumoti yangilandi ($(date +%Y-%m-%d))"
            git push
          fi
