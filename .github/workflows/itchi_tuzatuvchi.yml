name: AI IT-chi tuzatuvchi

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Yiqilgan run ID (bo'sh qoldirilsa — oxirgi yiqilganini o'zi topadi)"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write
  actions: read

jobs:
  tuzat:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tashxis va tuzatish (PR)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          RUN_ID: ${{ github.event.inputs.run_id }}
        run: python itchi_tuzatuvchi.py
