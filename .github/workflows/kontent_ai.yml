name: AI kontent reja

on:
  # >>> TASHQI TETIK (cron-job.org) ishlatilgani uchun jadval O'CHIRILDI. Qaytarish: pastdagi # belgilarni olib tashlang. <<<
  # schedule:
  #   # Har dushanba UTC 03:00 = Toshkent 08:00
  #   - cron: '0 3 * * 1'
  workflow_dispatch:  # qo'lda ham ishga tushirish mumkin

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutubxonalar
        run: pip install cryptography

      - name: AI reja tuzish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SAVDO_PAROL: ${{ secrets.SAVDO_PAROL }}
        run: python kontent_ai_generator.py

      - name: Natijani saqlash (shifrlangan)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Eski ochiq fayllarni repodan/saytdan o'chiramiz (maxfiylik)
          git rm --quiet --ignore-unmatch kontent_reja_ai.json kontent_reja_arxiv.json || true
          [ -f kontent_reja_ai.enc.json ] && git add kontent_reja_ai.enc.json || true
          [ -f kontent_reja_arxiv.enc.json ] && git add kontent_reja_arxiv.enc.json || true
          git diff --staged --quiet || git commit -m "AI kontent reja yangilandi ($(date +%Y-%m-%d))"
          git push
