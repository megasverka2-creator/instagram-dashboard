name: Ofitsiant reytingi (haftalik)

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:
    inputs:
      rejim:
        description: "Hisobot rejimi"
        type: choice
        options: [hammasi, filial, umumiy]
        default: hammasi

jobs:
  reyting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reyting tuzish va yuborish
        env:
          IIKO_LOGIN: ${{ secrets.IIKO_LOGIN }}
          IIKO_PASS: ${{ secrets.IIKO_PASS }}
          IIKO_SERVER: ${{ secrets.IIKO_SERVER }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          KASSIR_NOMLAR: "Jahongir,Диёр,1,Shahzoda,Shahina"
        run: python3 ofitsiant_reyting.py "${{ github.event.inputs.rejim || 'hammasi' }}"
