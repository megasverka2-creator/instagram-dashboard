name: AI post-tahlilchi

on:
  # >>> TASHQI TETIK (cron-job.org) ishlatilgani uchun jadval O'CHIRILDI. Qaytarish: pastdagi # belgilarni olib tashlang. <<<
  # schedule:
  #   # Har kuni UTC 05:17 = Toshkent 10:17 (Instagram yig'ilishidan keyin)
  #   - cron: '17 5 * * *'
  workflow_dispatch:  # qo'lda ham ishga tushirish mumkin

permissions:
  contents: write

jobs:
  tahlil:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Shifrlash kutubxonasi
        run: pip install cryptography

      - name: Postlarni baholash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SAVDO_PAROL: ${{ secrets.SAVDO_PAROL }}
        run: python3 post_tahlilchi.py

      - name: Natijani saqlash (shifrlangan)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Eski ochiq fayl bo'lsa repodan va saytdan o'chiramiz (maxfiylik)
          git rm --quiet --ignore-unmatch post_tahlil.json || true
          [ -f post_tahlil.enc.json ] && git add post_tahlil.enc.json || true
          git diff --staged --quiet || git commit -m "AI post-tahlili yangilandi ($(date +%Y-%m-%d))"
          git push
