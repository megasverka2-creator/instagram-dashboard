name: Postgres zaxira nusxa

on:
  schedule:
    - cron: "0 1 * * 3"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump olish (Docker, Postgres 17 klienti)
        env:
          DB: ${{ secrets.STOP_DATABASE_URL }}
        run: |
          set -euo pipefail
          docker run --rm postgres:17 pg_dump "$DB" > backup.sql
          HAJM=$(wc -c < backup.sql)
          echo "Dump hajmi: $HAJM bayt"
          if [ "$HAJM" -lt 1000 ]; then
            echo "XATO: dump juda kichik - backup ishlamadi!"
            exit 1
          fi
          grep -c "CREATE TABLE" backup.sql

      - name: Shifrlash
        env:
          PAROL: ${{ secrets.BACKUP_PAROL }}
        run: |
          set -euo pipefail
          gzip backup.sql
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -pass env:PAROL -in backup.sql.gz -out backup.sql.gz.enc
          rm backup.sql.gz
          ls -la backup.sql.gz.enc

      - name: Artifact sifatida saqlash
        uses: actions/upload-artifact@v4
        with:
          name: postgres-backup-${{ github.run_id }}
          path: backup.sql.gz.enc
          retention-days: 90
