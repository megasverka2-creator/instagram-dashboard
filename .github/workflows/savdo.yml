name: iiko savdo yig'ish

on:
  schedule:
    # Har kuni UTC 04:30 = Toshkent 09:30 (Instagram yig'ishdan keyin)
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Savdo ma'lumotlarini yig'ish
        env:
          IIKO_SERVER: ${{ secrets.IIKO_SERVER }}
          IIKO_LOGIN: ${{ secrets.IIKO_LOGIN }}
          IIKO_PASS: ${{ secrets.IIKO_PASS }}
        run: python iiko_collector.py

      - name: Natijani saqlash (commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f savdo_data.json ] && git add savdo_data.json || true
          [ -f savdo_taomlar.json ] && git add savdo_taomlar.json || true
          git diff --staged --quiet || git commit -m "Savdo ma'lumotlari yangilandi ($(date +%Y-%m-%d))"
          git push
