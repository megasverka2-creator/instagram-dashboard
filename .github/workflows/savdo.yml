name: iiko savdo yig'ish

on:
  # >>> TASHQI TETIK (cron-job.org) ishlatilgani uchun jadval O'CHIRILDI. Qaytarish: pastdagi # belgilarni olib tashlang. <<<
  # schedule:
  #   # Har kuni UTC 04:30 = Toshkent 09:30 (Instagram yig'ishdan keyin)
  #   - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutubxonalar
        run: pip install cryptography

      - name: Savdo ma'lumotlarini yig'ish
        env:
          IIKO_SERVER: ${{ secrets.IIKO_SERVER }}
          IIKO_LOGIN: ${{ secrets.IIKO_LOGIN }}
          IIKO_PASS: ${{ secrets.IIKO_PASS }}
          SAVDO_PAROL: ${{ secrets.SAVDO_PAROL }}
        run: python iiko_collector.py

      - name: Natijani saqlash (commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          [ -f savdo_data.enc.json ] && git add savdo_data.enc.json || true
          [ -f savdo_taomlar.enc.json ] && git add savdo_taomlar.enc.json || true
          [ -f savdo_turlar.enc.json ] && git add savdo_turlar.enc.json || true
          [ -f savdo_taom_kun.enc.json ] && git add savdo_taom_kun.enc.json || true
          # Eski ochiq fayllarni repodan olib tashlash (bir martalik, xavfsiz)
          git rm -q --cached savdo_data.json 2>/dev/null || true
          git rm -q --cached savdo_taomlar.json 2>/dev/null || true
          rm -f savdo_data.json savdo_taomlar.json
          git diff --staged --quiet || git commit -m "Savdo ma'lumotlari yangilandi ($(date +%Y-%m-%d))"
          git push
