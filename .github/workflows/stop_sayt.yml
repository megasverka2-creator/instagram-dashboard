name: Stop-list ma'lumoti (saytga)

on:
  schedule:
    # Har kuni UTC 17:40 = Toshkent 22:40 (bot 22:00 xulosasidan keyin).
    # GitHub jadvali 15-60 daqiqa kechikishi mumkin — bu yerda muammo emas,
    # chunki marketolog bot faylni ertasi kuni o'qiydi.
    - cron: '40 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Kutubxonalar
        run: pip install cryptography psycopg2-binary

      - name: Stop ma'lumotini yig'ish va shifrlash
        env:
          STOP_DATABASE_URL: ${{ secrets.STOP_DATABASE_URL }}
          SAVDO_PAROL: ${{ secrets.SAVDO_PAROL }}
        run: python stop_sayt_collector.py

      - name: Natijani saqlash (commit)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          [ -f stop_tahlil.enc.json ] && git add stop_tahlil.enc.json || true
          git diff --staged --quiet || git commit -m "Stop tahlil ma'lumoti yangilandi ($(date +%Y-%m-%d))"
          git push
