name: Stop xabar sinovi (namuna)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sinov:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4
      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Namuna xabarni guruhga yuborish
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          STOP_CHAT_ID: ${{ secrets.STOP_CHAT_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 stop_xabar_sinov.py
