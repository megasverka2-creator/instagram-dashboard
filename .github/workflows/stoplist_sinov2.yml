name: Stop-list sinovi 2 (iikoCloud)

on:
  workflow_dispatch:  # faqat qo'lda ishga tushiriladi

permissions:
  contents: read

jobs:
  sinov:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: iikoCloud stop-list sinovi
        env:
          IIKO_CLOUD_APILOGIN: ${{ secrets.IIKO_CLOUD_APILOGIN }}
        run: python3 stoplist_sinov2.py
