<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RestoPulse — Kirish</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#F2F2F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --ink:#1C1C1E; --muted:rgba(60,60,67,.6); --faint:rgba(60,60,67,.35);
    --sep:rgba(60,60,67,.12); --tint:#FF2D55; --fill:rgba(118,118,128,.12);
    --sf:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',Inter,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:var(--sf);min-height:100vh;min-height:100dvh;
    display:flex;align-items:center;justify-content:center;
    color:var(--ink);background:var(--bg);padding:22px;-webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:380px;padding:42px 32px 28px;text-align:center;
    background:var(--card);border-radius:24px;
    box-shadow:0 1px 2px rgba(0,0,0,.04),0 12px 36px rgba(0,0,0,.07);
    animation:rise .55s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.card{animation:none}}
  .logo{width:76px;height:76px;border-radius:18px;margin:0 auto 18px;display:block;
    box-shadow:0 8px 22px rgba(255,45,85,.28)}
  h1{font-size:28px;font-weight:700;letter-spacing:-.6px;line-height:1}
  .tag{color:var(--muted);font-size:14px;margin:8px 0 26px;letter-spacing:-.1px}
  .brands{display:flex;gap:7px;justify-content:center;margin:-16px 0 26px}
  .brands span{font-size:11.5px;font-weight:500;color:var(--muted);padding:4.5px 12px;border-radius:999px;background:var(--fill)}
  input{
    width:100%;border:none;background:var(--fill);
    border-radius:13px;padding:14px 16px;font-family:inherit;font-size:17px;color:var(--ink);
    outline:none;text-align:center;transition:box-shadow .2s,background .2s;
  }
  input::placeholder{color:var(--faint)}
  input:focus{background:#fff;box-shadow:0 0 0 2px var(--tint) inset}
  button{
    width:100%;margin-top:12px;border:none;cursor:pointer;padding:14.5px;border-radius:13px;
    font-family:inherit;font-size:16px;font-weight:600;color:#fff;letter-spacing:-.2px;
    background:var(--tint);box-shadow:0 6px 18px rgba(255,45,85,.28);
    transition:transform .15s,opacity .2s,box-shadow .2s;
  }
  button:hover{transform:translateY(-1px);box-shadow:0 9px 24px rgba(255,45,85,.34)}
  button:active{transform:scale(.985);opacity:.9}
  .err{color:#FF3B30;font-size:13px;font-weight:500;margin-top:12px;min-height:18px}
  .foot{margin-top:22px;font-size:12px;color:var(--faint);letter-spacing:-.1px}
</style>
</head>
<body>
  <div class="card">
    <img src="icon-192.png" class="logo" alt="RestoPulse">
    <h1>RestoPulse</h1>
    <div class="tag">Restoran marketing intellekti</div>
    <div class="brands"><span>Benison</span><span>Dieto</span><span>Eddo</span></div>
    <input type="password" id="parol" placeholder="Parolni kiriting" autofocus>
    <button onclick="kirish()">Kirish</button>
    <div class="err" id="err"></div>
    <div class="foot">Faqat jamoa a'zolari uchun</div>
  </div>

<script>
const PAROL_HASH = "38f35912846eb95406aa8620795a68851541e0bd26e1969216ab22352b11f958";

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

async function kirish() {
  const val = document.getElementById("parol").value;
  if (!val) return;
  const hash = await sha256(val);
  if (hash === PAROL_HASH) {
    sessionStorage.setItem("rp_auth", hash);
    // Shifrlangan savdo ma'lumotlarini ochish uchun (faqat shu brauzer seansida saqlanadi)
    sessionStorage.setItem("rp_pw", btoa(unescape(encodeURIComponent(val))));
    location.replace("index.html");
  } else {
    document.getElementById("err").textContent = "Parol noto'g'ri. Qayta urinib ko'ring.";
    document.getElementById("parol").value = "";
  }
}
document.getElementById("parol").addEventListener("keydown", e => { if (e.key === "Enter") kirish(); });
</script>
</body>
</html>
