<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RestoPulse — Kirish</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#d62976">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    color:#2a1a3e; overflow:hidden; -webkit-font-smoothing:antialiased; padding:20px;
  }
  body::before {
    content:''; position:fixed; inset:-20%; z-index:-1;
    background: linear-gradient(135deg, #feda75 0%, #fa7e1e 22%, #d62976 50%, #962fbf 74%, #4f5bd5 100%);
    background-size:300% 300%; animation:drift 22s ease infinite;
  }
  @keyframes drift { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
  @media (prefers-reduced-motion: reduce){ body::before{animation:none;} }
  .card {
    width:100%; max-width:380px; padding:40px 34px; text-align:center;
    background:rgba(255,255,255,0.6); backdrop-filter:blur(24px) saturate(1.4);
    -webkit-backdrop-filter:blur(24px) saturate(1.4);
    border:1px solid rgba(255,255,255,0.65); border-radius:28px;
    box-shadow:0 12px 44px rgba(80,30,120,0.25);
  }
  .logo { width:84px; height:84px; border-radius:24px; margin:0 auto 18px; display:block;
    box-shadow:0 8px 26px rgba(214,41,118,0.45); }
  h1 { font-size:26px; font-weight:800; letter-spacing:-0.5px; }
  .tag { color:#6b5b8a; font-size:13.5px; margin:6px 0 26px; }
  input {
    width:100%; border:1.5px solid rgba(150,47,191,0.25); background:rgba(255,255,255,0.75);
    border-radius:15px; padding:14px 16px; font-family:inherit; font-size:16px;
    color:#2a1a3e; outline:none; text-align:center; transition:border .2s;
  }
  input:focus { border-color:#962fbf; }
  button {
    width:100%; margin-top:13px; border:none; cursor:pointer; padding:14px;
    border-radius:15px; font-family:inherit; font-size:15px; font-weight:700; color:#fff;
    background:linear-gradient(135deg,#d62976,#962fbf);
    box-shadow:0 5px 18px rgba(214,41,118,0.4); transition:transform .15s;
  }
  button:hover { transform:translateY(-2px); }
  .err { color:#d23b5e; font-size:13px; font-weight:600; margin-top:12px; min-height:18px; }
  .foot { margin-top:22px; font-size:11.5px; color:#6b5b8a; }
</style>
</head>
<body>
  <div class="card">
    <img src="icon-192.png" class="logo" alt="RestoPulse">
    <h1>RestoPulse</h1>
    <div class="tag">Benison · Dieto · Eddo — Instagram analitika</div>
    <input type="password" id="parol" placeholder="Parolni kiriting" autofocus>
    <button onclick="kirish()">Kirish</button>
    <div class="err" id="err"></div>
    <div class="foot">Faqat jamoa a'zolari uchun</div>
  </div>

<script>
const PAROL_HASH = "38f35912846eb95406aa8620795a68851541e0bd26e1969216ab22352b11f958";

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

async function kirish() {
  const val = document.getElementById("parol").value;
  if (!val) return;
  const hash = await sha256(val);
  if (hash === PAROL_HASH) {
    sessionStorage.setItem("rp_auth", hash);
    // Shifrlangan savdo ma'lumotlarini ochish uchun (faqat shu brauzer seansida saqlanadi)
    sessionStorage.setItem("rp_pw", btoa(unescape(encodeURIComponent(val))));
    location.replace("index.html");
  } else {
    document.getElementById("err").textContent = "Parol noto'g'ri. Qayta urinib ko'ring.";
    document.getElementById("parol").value = "";
  }
}
document.getElementById("parol").addEventListener("keydown", e => { if (e.key === "Enter") kirish(); });
</script>
</body>
</html>
