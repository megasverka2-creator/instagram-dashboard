<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RestoPulse — Kirish</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#15101F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;450;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#F6F1FB; --muted:rgba(246,241,251,.62); --faint:rgba(246,241,251,.40);
    --coral:#FF7A59; --magenta:#E0408A; --indigo:#6C6CF0;
    --glass:rgba(255,255,255,.055); --glass-bd:rgba(255,255,255,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    color:var(--ink);background:#15101F;overflow:hidden;padding:22px;-webkit-font-smoothing:antialiased;
  }
  body::before{
    content:'';position:fixed;inset:-30%;z-index:-1;
    background:
      radial-gradient(38% 42% at 22% 18%, rgba(255,122,89,.42), transparent 70%),
      radial-gradient(40% 45% at 82% 26%, rgba(224,64,138,.40), transparent 70%),
      radial-gradient(48% 50% at 60% 88%, rgba(108,108,240,.42), transparent 72%);
    filter:blur(34px);animation:float 26s ease-in-out infinite;
  }
  body::after{
    content:'';position:fixed;inset:0;z-index:-1;
    background:radial-gradient(120% 90% at 50% 0%, transparent 40%, rgba(10,6,18,.55) 100%);
  }
  @keyframes float{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(0,-3%,0) scale(1.06)}}
  @media (prefers-reduced-motion:reduce){body::before{animation:none}}

  .card{
    width:100%;max-width:392px;padding:46px 36px 30px;text-align:center;
    background:var(--glass);backdrop-filter:blur(40px) saturate(1.5);
    -webkit-backdrop-filter:blur(40px) saturate(1.5);
    border:1px solid var(--glass-bd);border-radius:30px;
    box-shadow:0 30px 80px rgba(8,3,20,.55), inset 0 1px 0 rgba(255,255,255,.16);
    animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.card{animation:none}}

  .logo{
    width:78px;height:78px;border-radius:22px;margin:0 auto 20px;display:block;
    box-shadow:0 14px 38px rgba(224,64,138,.5);
  }
  h1{font-family:'Fraunces',serif;font-size:33px;font-weight:600;letter-spacing:-.5px;line-height:1}
  .tag{color:var(--muted);font-size:13.5px;margin:9px 0 30px;letter-spacing:.1px}
  .brands{display:flex;gap:7px;justify-content:center;margin:-20px 0 28px}
  .brands span{font-size:11px;font-weight:500;color:var(--muted);padding:4px 11px;border-radius:999px;
    border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.04)}
  input{
    width:100%;border:1.5px solid rgba(255,255,255,.16);background:rgba(255,255,255,.06);
    border-radius:15px;padding:15px 16px;font-family:inherit;font-size:16px;color:var(--ink);
    outline:none;text-align:center;transition:border .2s,background .2s;
  }
  input::placeholder{color:var(--faint)}
  input:focus{border-color:rgba(224,64,138,.75);background:rgba(255,255,255,.09)}
  button{
    width:100%;margin-top:13px;border:none;cursor:pointer;padding:15px;border-radius:15px;
    font-family:inherit;font-size:15px;font-weight:600;color:#fff;letter-spacing:.2px;
    background:linear-gradient(135deg,var(--coral) 0%,var(--magenta) 55%,var(--indigo) 130%);
    box-shadow:0 10px 28px rgba(224,64,138,.42);transition:transform .15s,box-shadow .2s;
  }
  button:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(224,64,138,.5)}
  button:active{transform:translateY(0)}
  .err{color:#ff9bb0;font-size:13px;font-weight:500;margin-top:13px;min-height:18px}
  .foot{margin-top:24px;font-size:11.5px;color:var(--faint);letter-spacing:.2px}
</style>
</head>
<body>
  <div class="card">
    <img src="icon-192.png" class="logo" alt="RestoPulse">
    <h1>RestoPulse</h1>
    <div class="tag">Restoran marketing intellekti</div>
    <div class="brands"><span>Benison</span><span>Dieto</span><span>Eddo</span></div>
    <input type="password" id="parol" placeholder="Parolni kiriting" autofocus>
    <button onclick="kirish()">Kirish</button>
    <div class="err" id="err"></div>
    <div class="foot">Faqat jamoa a'zolari uchun</div>
  </div>

<script>
const PAROL_HASH = "38f35912846eb95406aa8620795a68851541e0bd26e1969216ab22352b11f958";

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

async function kirish() {
  const val = document.getElementById("parol").value;
  if (!val) return;
  const hash = await sha256(val);
  if (hash === PAROL_HASH) {
    sessionStorage.setItem("rp_auth", hash);
    // Shifrlangan savdo ma'lumotlarini ochish uchun (faqat shu brauzer seansida saqlanadi)
    sessionStorage.setItem("rp_pw", btoa(unescape(encodeURIComponent(val))));
    location.replace("index.html");
  } else {
    document.getElementById("err").textContent = "Parol noto'g'ri. Qayta urinib ko'ring.";
    document.getElementById("parol").value = "";
  }
}
document.getElementById("parol").addEventListener("keydown", e => { if (e.key === "Enter") kirish(); });
</script>
</body>
</html>
